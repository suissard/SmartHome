# Outillage du projet (lint, tests). Les dépendances restent dans requirements.txt
# (lues par install.sh / install.ps1) ; requirements-dev.txt ajoute les outils de développement.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smarthome"
version = "0.1.0"
description = "Assistant vocal domotique 100 % local"
requires-python = ">=3.10"

[project.scripts]
smarthome = "core.cli:main"

[tool.setuptools]
py-modules = ["main", "mcp_server"]

[tool.setuptools.packages.find]
include = ["core*", "audio*", "llm*", "actions*", "gateway*"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = [".venv", "venv", "env", "pocketbase", "voices", "wakewords", "data", "logs"]

[tool.ruff.lint]
# Pyflakes (noms indéfinis, imports morts…), avertissements, erreurs de syntaxe et bugbear (B).
select = ["F", "W", "E7", "E9", "B"]
# `from core.config import *` dans core/__init__.py : réexport voulu.
per-file-ignores = { "core/__init__.py" = ["F403"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Tests manuels (vraies actions sur la machine) : lancés à la main uniquement.
addopts = "--ignore=tests/test_actions_manual.py --ignore=tests/test_sound.py"
